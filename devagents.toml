# DevAgents 运行时配置（本机）
# 密钥只放环境变量，本文件不含任何 key。
# protocol = "anthropic" = MiMo Token Plan 套餐（tp-key，MIMO_TP_API_KEY）
# protocol = "openai"    = MiMo 按量（sk-key，MIMO_API_KEY）——换回按量时改这两处即可

[llm]
protocol = "anthropic"
base_url = "https://token-plan-cn.xiaomimimo.com/anthropic"
key_env = "MIMO_TP_API_KEY"
timeout_s = 180
max_output_tokens = 16384

[roles]
spec = "mimo-v2.5-pro"
arch = "mimo-v2.5-pro"
code = "mimo-v2.5"
test = "mimo-v2.5"
review = "mimo-v2.5-pro"

[pipeline]
context_budget_tokens = 60000
file_token_limit = 12000
fix_rounds_max = 2
gate_retry = 1
transport_retry = 1
runner_timeout_s = 180

# Token Plan 按 credits 计费，非元/token → 账单只报 token，不折算（如实呈现）
[prices]

[storage]
runs_dir = "runs"
